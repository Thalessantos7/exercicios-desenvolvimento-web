<!DOCTYPE html>
<html>

    <head>

        <meta charset="UTF-8"/>
        <title>TodoList - JavaScript</title>
        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <main class="container">
            <h1>TodoList</h1>

            <div id="task-form">

                <input 
                    id="task-description"
                    type="text"
                    placeholder="Informe a tarefa..."
                />

                <button id="task-button">Adicionar</button> 

            </div>

            <ul id="task-list"> 
            </ul>

        </main>

        <script src="script.js"></script>

    </body>

</html>
